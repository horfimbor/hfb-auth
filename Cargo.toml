[workspace]
resolver = "2"
members = [
    "public-user-event",
    "public-account-event",
    "server",
    "shared",
]

[workspace.dependencies]
horfimbor-eventsource = "0.3.6"
horfimbor-jwt = { version = "0.2.0",features = ["server"] }
#horfimbor-eventsource = { path = "../horfimbor-engine/horfimbor-eventsource" }
#horfimbor-jwt = { path = "../horfimbor-engine/horfimbor-jwt" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
kurrentdb = "1.0"
redis = { version = "1.0", features = ["tokio-rustls-comp"] }
uuid = { version = "1.8", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"

# TODO move out
public-user-event = { path = "public-user-event", features = ["server"] }
public-account-event = { path = "public-account-event", features = ["server"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
